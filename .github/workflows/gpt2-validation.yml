# Lightweight CPU validation for the GPT-2 SAE faithfulness code (added 2026-11-13, remediation D6).
# No GPU, no model weights, no checkpoints or activation caches: those live only on the research machine.
name: GPT-2 SAE validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, sae-research]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt2-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install CPU dependencies (versions pinned as in requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
          pip install numpy==2.5.3 pandas==3.0.5 scipy==1.18.1 scikit-learn==1.9.1 joblib==1.6.0 \
                      transformer-lens==3.9.0 pytest==8.4.2

      - name: Repository hygiene (no checkpoints, caches, logs, credentials or home paths)
        run: python scripts/shared/ci_repo_hygiene.py

      - name: Syntax check (all tracked Python)
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile

      - name: Import check (shared modules)
        run: |
          python - <<'PY'
          import importlib
          for m in ('src.evaluation.faithfulness_metrics', 'src.evaluation.information_levels',
                    'src.sae.modern_sae', 'src.sae.checkpoint_registry', 'src.sae.steering'):
              importlib.import_module(m)
              print('import ok:', m)
          PY

      - name: Unit tests
        run: python -m pytest -q src/tests

      - name: Reproducibility check (M5 test pass re-derived from committed result files)
        run: python scripts/shared/m5_independent_verification.py
