name: tests

# Runs the unit tests on every push and pull request. Instructor Review #6:
# "no CI; new code without tests". The tests use tiny fake models, so they need
# no GPU, no model download and no network.

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU-only torch and the light test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ci.txt
      - name: Run tests
        run: python -m pytest -q
